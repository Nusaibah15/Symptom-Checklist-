<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Symptom Tracker</h2>
        <p>Enter a symptom and save it.</p>
        
        <input type="text" id="symptomInput" placeholder="e.g., Headache, Cough">
        <button onclick="saveSymptom()">Save Symptom</button>
        
        <h3>Saved Symptoms</h3>
        <ul id="symptomList"></ul>
    </div>

    <!-- Script must be type="module" to use Firebase imports -->
    <script type="module" src="Script.js"></script>
</body>
</html>
